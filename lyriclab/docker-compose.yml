version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend:/app
      - ./agent:/agent
      - data:/data
      - downloads:/downloads
      - output:/output
    deploy:
      resources:
        limits:
          memory: 4g

volumes:
  data:
  downloads:
  output:
